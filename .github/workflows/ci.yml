name: QUANT CI

# Trigger policy: pull_request events are hosted-only. The licensed native-q
# job is gated by an explicit job condition and an exact protected-main SHA
# check. Third-party Actions are pinned to full commit SHAs, not mutable tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev zlib1g-dev

      - name: Configure (portable build, KDB-X disabled)
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_WITH_KDBX=OFF

      - name: Build
        run: cmake --build build -j 2

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: C++ unit and integration tests
        run: ./build/quant_tests

      - name: Configuration validation
        run: ./build/quant validate

      - name: Python research self-test
        run: python3 python/research.py --self-test

      - name: Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_dataset_contract.py tests/test_research.py -q

      - name: Single-file assurance gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --quiet black
          python3 scripts/assurance.py check --allow-dirty

  sanitizers:
    name: ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev zlib1g-dev

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DQUANT_WITH_KDBX=OFF
          -DQUANT_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build-san -j 2

      - name: Run sanitizer unit tests
        run: ASAN_OPTIONS=detect_leaks=0 ./build-san/quant_tests

  native-q:
    name: Native KDB-X recovery (gated tier)
    # PORTABLE_RESEARCH scope does not require this job: portable CI builds
    # with QUANT_WITH_KDBX=OFF and certifies no q behaviour here. Enabling it
    # requires the Q_PERSISTENCE scope, a governed self-hosted runner with a
    # licensed q runtime in protected secrets, and the evidence checker below.
    # A green pytest exit code alone is not proof: skips must become failures
    # and the JUnit report must be cross-checked against recorded evidence.
    # This job is NOT a required status check for PORTABLE_RESEARCH.
    #
    # Licensed-runner requirements (all mandatory before enabling this tier):
    # - dedicated runner group that accepts only this qualification job;
    # - ephemeral single-job runner booted from a controlled image;
    # - no runner reuse from untrusted builds or pull request jobs;
    # - minimal GITHUB_TOKEN permissions: contents: read at workflow level,
    #   no write scopes granted to this job;
    # - restricted egress to the package sources needed by the pinned build;
    # - licensed-runtime credentials in protected secrets, injected only
    #   into the steps that need QHOME, never printed;
    # - third-party Actions pinned to full commit SHAs, never tags;
    # - destroy the runner after qualification, on success and on failure.
    if: github.event_name != 'pull_request' && vars.QUANT_NATIVE_Q_ENABLED == 'true'
    runs-on:
      group: quant-native-q
      labels: [self-hosted, quant-native-q]
    env:
      QUANT_NATIVE_Q_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # GitHub does not expose runner labels as an environment variable; the
      # label set below mirrors this job's explicit runs-on group/labels and
      # is checked against the exact HEAD SHA by the capture script. These
      # values are declared, not observed: the separate runner-attestation
      # job below reads the actual runner identity from the GitHub API.
      - name: Capture dedicated runner evidence
        env:
          QHOME: ${{ secrets.QUANT_QHOME }}
          QUANT_EXPECTED_SHA: ${{ github.sha }}
          RUNNER_LABELS: self-hosted,quant-native-q
        run: python3 scripts/capture_runner_evidence.py --output data/assurance/runner-evidence.json

      - name: Qualify exact protected main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch --no-tags origin main
          head_sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            printf 'event SHA is not a full 40-hex commit id\n' >&2
            exit 1
          fi
          if [ "$head_sha" != "$EXPECTED_SHA" ] || \
             [ "$main_sha" != "$EXPECTED_SHA" ]; then
            printf 'native-q requires the exact main tip: expected=%s head=%s main=%s\n' \
              "$EXPECTED_SHA" "$head_sha" "$main_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            printf 'qualification commit is not reachable from origin/main\n' >&2
            exit 1
          fi
          printf 'qualified exact main commit %s on licensed runner\n' "$head_sha"

      - name: Verify licensed q runtime
        env:
          QHOME: ${{ secrets.QUANT_QHOME }}
        run: |
          test -n "$QHOME"
          test -x "$QHOME/bin/q"
          command -v cmake
          command -v ninja
          printf 'q runtime verified; license material not printed\n'

      - name: Provision pinned test environment
        run: |
          python3 -m venv data/venv
          data/venv/bin/python -m pip install --quiet -r requirements.txt
          data/venv/bin/python - <<'PY'
          from importlib.metadata import version

          print("pykx", version("pykx"))
          print("pytest", version("pytest"))
          PY

      - name: Configure and build KDB-X C API
        env:
          QHOME: ${{ secrets.QUANT_QHOME }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQUANT_WITH_KDBX=ON \
            -DQUANT_PYTHON_EXECUTABLE="$GITHUB_WORKSPACE/data/venv/bin/python"
          cmake --build build -j 2

      - name: Record q runtime and C API evidence
        env:
          QHOME: ${{ secrets.QUANT_QHOME }}
        run: |
          data/venv/bin/python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from importlib.metadata import version
          from pathlib import Path

          root = Path(".")
          assurance = root / "data" / "assurance"
          assurance.mkdir(parents=True, exist_ok=True)
          qbin = Path(os.environ["QHOME"]) / "bin" / "q"
          probe = subprocess.run(
              [str(qbin), "-q"],
              input="echo 'QVERSION=', .z.K, '.', .z.k; exit 0\n",
              capture_output=True,
              text=True,
              timeout=60,
              check=False,
          )
          q_output = probe.stdout + probe.stderr
          match = re.search(r"QVERSION=(\d+(?:\.\d+){1,3})", q_output)
          if match is None:
              raise SystemExit(
                  "could not read q runtime version: " + q_output[-400:]
              )
          q_version = match.group(1)

          doctor = subprocess.run(
              [str(root / "build" / "quant"), "doctor"],
              capture_output=True,
              text=True,
              timeout=60,
              check=False,
          )
          available = "c_api=available" in (doctor.stdout + doctor.stderr)
          compile_db = (root / "build" / "compile_commands.json").read_text(
              encoding="utf-8"
          )
          compiled = "QUANT_HAS_KDBX=1" in compile_db
          c_api = "compiled" if compiled and available else "not compiled"
          detail = (
              "compile_commands QUANT_HAS_KDBX=1="
              + str(compiled).lower()
              + "; quant doctor c_api="
              + ("available" if available else "not compiled")
          )
          evidence = {
              "q_runtime_version": q_version,
              "pykx_version": version("pykx"),
              "pytest_version": version("pytest"),
              "python": str(root / "data" / "venv" / "bin" / "python"),
              "quant_binary": str(root / "build" / "quant"),
              "c_api": c_api,
              "c_api_detail": detail,
              "required": os.environ["QUANT_NATIVE_Q_REQUIRED"],
          }
          (assurance / "native-q-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          (assurance / "native-q-runtime.txt").write_text(
              "\n".join(
                  [
                      f"q_runtime_version={q_version}",
                      f"pykx_version={evidence['pykx_version']}",
                      f"pytest_version={evidence['pytest_version']}",
                      f"c_api={c_api}",
                      detail,
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          print(detail)
          if c_api != "compiled":
              raise SystemExit("KDB-X C API not enabled in build/quant")
          PY

      - name: Native q persistence and recovery tests
        env:
          QHOME: ${{ secrets.QUANT_QHOME }}
        run: >-
          data/venv/bin/python -m pytest tests/test_kdbx.py -q
          --junitxml=data/assurance/native-q-junit.xml

      - name: Verify native-q results (no empty or skipped runs)
        if: always()
        run: >-
          data/venv/bin/python scripts/check_native_q_results.py
          --junit data/assurance/native-q-junit.xml
          --evidence data/assurance/native-q-evidence.json

      - name: Upload native-q evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-q-evidence
          path: |
            data/assurance/native-q-junit.xml
            data/assurance/native-q-evidence.json
            data/assurance/native-q-runtime.txt
            build/CMakeCache.txt
            build/compile_commands.json
          if-no-files-found: warn

      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-evidence
          path: data/assurance/runner-evidence.json
          if-no-files-found: warn

  runner-attestation:
    name: Runner attestation (post-job API evidence)
    # GitHub-hosted and always attempted after native-q. The native-q tier is
    # gated and is NOT a required status check for PORTABLE_RESEARCH; when it
    # is skipped (pull_request or disabled variable), every step here is
    # skipped too so attestation cannot fail a portable event.
    needs: native-q
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_SHA: ${{ github.sha }}
      NATIVE_Q_RESULT: ${{ needs.native-q.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve native-q job database id
        if: env.NATIVE_Q_RESULT != 'skipped'
        run: |
          set -eu
          job_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs | map(select(.name == "Native KDB-X recovery (gated tier)")) | max_by(.id) | .id' \
              | head -n 1
          )
          if ! printf '%s' "$job_id" | grep -Eq '^[0-9]+$'; then
            printf 'could not resolve the native-q job database id\n' >&2
            exit 1
          fi
          printf 'NATIVE_Q_JOB_ID=%s\n' "$job_id" >> "$GITHUB_ENV"

      - name: Attest observed runner identity from GitHub API
        if: env.NATIVE_Q_RESULT != 'skipped'
        run: |
          python3 scripts/attest_runner.py attest \
            --run-id "${{ github.run_id }}" \
            --job-id "$NATIVE_Q_JOB_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --output data/assurance/runner-attestation.json

      - name: Upload runner attestation
        if: env.NATIVE_Q_RESULT != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-attestation
          path: data/assurance/runner-attestation.json
          if-no-files-found: warn

  release-assurance:
    name: Release assurance (offline)
    # Hosted-only tier for push to main and pull_request. Every suite runs
    # against the exact event commit (PR head, never the ephemeral merge
    # commit) on ubuntu-latest. No licensed runtime, provider network access
    # or mutable artifact is used: pinned snapshot bytes are tracked under
    # reference-data/instrument-master/ and digest-checked offline against
    # governance provenance. Re-pinning is a separate, reviewed provenance
    # update and never a CI step.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact event commit is checked out
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf 'checked out %s, expected exact commit %s\n' \
              "$actual_sha" "$EXPECTED_SHA" >&2
            exit 1
          fi
          printf 'offline assurance against exact commit %s\n' "$actual_sha"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install pinned offline dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      # The only snapshot step in hosted CI. Tracked reference bytes are
      # immutable; a mismatch fails the job with a precise diagnostic.
      # Network retrieval and pin updates are never part of this job.
      - name: Verify tracked immutable instrument snapshots (offline)
        run: python3 scripts/fetch_instrument_snapshots.py verify

      - name: Pinned instrument master tests (offline)
        run: python3 -m pytest tests/test_instrument_master.py -o addopts='' -q

      - name: Offline release assurance suites
        run: |
          python3 -m pytest \
            tests/test_release_bundle.py \
            tests/test_verify_report.py \
            tests/test_native_q_ci.py \
            tests/test_ci_security.py \
            tests/test_runner_evidence.py \
            tests/test_clean_room.py \
            tests/test_release_state.py \
            tests/test_audit_disposition.py \
            -o addopts='' -q

      - name: Governance schema validation
        run: |
          python3 scripts/style_contract.py
          python3 scripts/state_freshness.py
          python3 scripts/check_release_state.py check

      - name: Release bundle manifest and evidence verification
        run: |
          set -eu
          if [ -s data/evidence-artifact/quant-final.zip ]; then
            python3 scripts/release_bundle.py verify \
              --bundle data/evidence-artifact/quant-final.zip
          else
            printf 'NOT_APPLICABLE: no local release bundle supplied; pinned reference bytes are verified directly.\n'
          fi

  style-contract:
    name: Style contract (reference guides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev zlib1g-dev

      - name: Install pinned style tools
        run: |
          python3 -m pip install --quiet -r requirements.txt

      - name: Configure and build portable targets
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQUANT_WITH_KDBX=OFF
          cmake --build build -j 2
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DQUANT_WITH_KDBX=OFF \
            -DQUANT_SANITIZERS=ON
          cmake --build build-san -j 2

      - name: Reference-library and documentation contract
        run: python3 scripts/style_contract.py

      - name: C++ format contract (Google C++ style guide)
        run: clang-format --dry-run --Werror include/quant.hpp src/*.cpp tests/tests.cpp

      - name: Python contract (Google Python style guide)
        run: |
          ruff check .
          black --check .

      - name: Python lint contract (no disabled messages)
        run: pylint python/research.py scripts/*.py --rcfile=.pylintrc --score=no

      - name: Shell contract (Google Shell style guide)
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs shellcheck
          fi

      - name: Single-file assurance gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/assurance.py check --allow-dirty
