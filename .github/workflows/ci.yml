name: QUANT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev zlib1g-dev

      - name: Configure (portable build, KDB-X disabled)
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_WITH_KDBX=OFF

      - name: Build
        run: cmake --build build -j 2

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: C++ unit and integration tests
        run: ./build/quant_tests

      - name: Configuration validation
        run: ./build/quant validate

      - name: Python research self-test
        run: python3 python/research.py --self-test

      - name: Python tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_research.py tests/test_kdbx.py -q

      - name: Single-file assurance gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --quiet black
          python3 scripts/assurance.py check --allow-dirty

  sanitizers:
    name: ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libcurl4-openssl-dev zlib1g-dev

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DQUANT_WITH_KDBX=OFF
          -DQUANT_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build-san -j 2

      - name: Run sanitizer unit tests
        run: ASAN_OPTIONS=detect_leaks=0 ./build-san/quant_tests
