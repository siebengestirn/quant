[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "QUANT research support package"
requires-python = ">=3.12"

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["data", "build", "build-san", "references"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pylint.format]
max-line-length = 80

[tool.pylint.messages_control]
disable = []
