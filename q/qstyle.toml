  ".quant.ingest",
  ".quant.ingestBar",
  ".quant.featureHistory",
  ".quant.asofFeatures",
  ".quant.persist",
  ".quant.recover"
]
forbidden_tokens = ["eval", "system \"sh", "system \"bash"]
